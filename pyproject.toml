[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarmind"
version = "0.1.0"
description = "AI-Powered Research Paper Intelligence Assistant (ScholarMind AI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "datasets>=2.18.0",
    "huggingface-hub>=0.22.0",
    "nltk>=3.8.1",
    "spacy>=3.7.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
ml = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "rouge-score>=0.1.2",
    "accelerate>=0.29.0",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "pymupdf>=1.24.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "slow_model: tests requiring downloaded Hugging Face model weights (excluded from fast CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
