name: CD — Deploy to Microsoft Azure Container Apps

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-azure-production
  cancel-in-progress: false

jobs:
  deploy-azure:
    name: Build, Push to ACR & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deploy ONLY if triggered manually OR after CI succeeded on main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    env:
      IMAGE_NAME: scholarmind-ai
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate required Azure secrets
        run: |
          for var in AZURE_CREDENTIALS AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_API_APP_NAME AZURE_UI_APP_NAME; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required repository secret: $var. See docs/AZURE_DEPLOYMENT.md."
              exit 1
            fi
          done
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_API_APP_NAME: ${{ secrets.AZURE_API_APP_NAME }}
          AZURE_UI_APP_NAME: ${{ secrets.AZURE_UI_APP_NAME }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CPU production image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy FastAPI backend to Azure Container Apps
        run: |
          IMAGE_URI="${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          az containerapp update \
            --name "${{ secrets.AZURE_API_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${IMAGE_URI}" \
            --set-env-vars \
              APP_MODE=api \
              SCHOLARMIND_ENV=production \
              SCHOLARMIND_PROFILE=production \
              SCHOLARMIND_PORT=8000 \
              SCHOLARMIND_DATA_DIR=/app/data \
              SCHOLARMIND_ARTIFACTS_DIR=/app/artifacts \
              HF_HOME=/app/artifacts/hf_cache

      - name: Resolve live FastAPI FQDN and deploy Streamlit UI
        id: deploy_ui
        run: |
          IMAGE_URI="${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          API_FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_API_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          az containerapp update \
            --name "${{ secrets.AZURE_UI_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${IMAGE_URI}" \
            --set-env-vars \
              APP_MODE=ui \
              SCHOLARMIND_ENV=production \
              SCHOLARMIND_PROFILE=production \
              SCHOLARMIND_UI_PORT=8501 \
              SCHOLARMIND_API_URL="https://${API_FQDN}"

          UI_FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_UI_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "api_url=https://${API_FQDN}" >> "$GITHUB_OUTPUT"
          echo "ui_url=https://${UI_FQDN}" >> "$GITHUB_OUTPUT"

      - name: Post-deployment live HTTPS health verification
        run: |
          echo "Checking FastAPI health: ${{ steps.deploy_ui.outputs.api_url }}/health"
          for i in $(seq 1 15); do
            if curl -fsS "${{ steps.deploy_ui.outputs.api_url }}/health"; then
              echo ""
              echo "FastAPI live health check PASSED!"
              break
            fi
            sleep 4
          done
          echo "Checking Streamlit UI health: ${{ steps.deploy_ui.outputs.ui_url }}/_stcore/health"
          curl -fsS "${{ steps.deploy_ui.outputs.ui_url }}/_stcore/health"

      - name: Publish Azure Deployment Summary
        run: |
          {
            echo "## ScholarMind AI — Microsoft Azure Deployment Summary"
            echo "- **Image:** \`${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\`"
            echo "- **FastAPI Backend:** ${{ steps.deploy_ui.outputs.api_url }}"
            echo "- **API Swagger Docs:** ${{ steps.deploy_ui.outputs.api_url }}/docs"
            echo "- **Streamlit Dashboard:** ${{ steps.deploy_ui.outputs.ui_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
