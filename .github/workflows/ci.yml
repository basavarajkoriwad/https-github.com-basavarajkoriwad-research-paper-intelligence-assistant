name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Dependency Check & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install CPU dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Dependency integrity check
        run: pip check

      - name: Code quality & lint check (Ruff)
        run: ruff check src tests scripts

      - name: Run unit, NLP, DL, and FastAPI backend tests (excluding multi-GB HF downloads)
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          pytest -m "not slow_model" -v --junitxml=pytest-ci-report.xml

      - name: Verify Streamlit UI module loads cleanly
        run: python -c "import scholarmind.ui.app as ui; assert len(ui.SECTIONS) == 10; print('UI OK')"

      - name: Publish CI summary
        if: always()
        run: |
          {
            echo "## ScholarMind AI — CI Validation Summary"
            echo "- **Branch / Ref:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA::8}\`"
            echo "- **Lint & Tests Status:** \`${{ job.status }}\`"
            echo "- **Note:** Multi-GB Hugging Face model tests are marked \`@pytest.mark.slow_model\` and validated offline/pre-release; all unit, PyTorch model, NLP, PDF, FAISS, and FastAPI endpoint tests execute on every push/PR."
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build-check:
    name: Docker Build & Live Health Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: scholarmind-ai:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test live FastAPI container (/health and /system/status)
        run: |
          docker run -d --name sm-ci-api -p 8000:8000 -e APP_MODE=api scholarmind-ai:ci-test
          trap 'docker logs sm-ci-api || true; docker rm -f sm-ci-api || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              curl -fsS http://127.0.0.1:8000/system/status | head -c 400
              echo ""
              echo "Container health check PASSED!"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy within 60s."
          exit 1
