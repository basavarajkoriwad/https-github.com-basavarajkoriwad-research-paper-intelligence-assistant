# Tier 2: Consumer GPU Profile (8-16 GB VRAM: RTX 3060/4060/4070 / Colab T4)
profile: "gpu_consumer"
hardware:
  preferred_device: "cuda"
  precision: "fp16"
  quantization: "4bit"
  num_workers: 4
  batch_size: 32

models:
  pdf_parser: "docling"
  embedding: "BAAI/bge-m3"
  reranker: "BAAI/bge-reranker-v2-m3"
  extractive_qa: "allenai/scibert_scivocab_uncased"
  summarizer: "google/long-t5-tglobal-base"
  llm_provider: "ollama"
  llm_model: "qwen2.5:7b"
